spring:
  application:
    name: foldpapper

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/foldpapper}
    username: ${DB_USER:foldpapper}
    password: ${DB_PASSWORD:foldpapper}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # схемой управляет Flyway, Hibernate только проверяет соответствие
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

app:
  # список источников, которым разрешён CORS (фронтенд в деве)
  allowed-origins:
    - http://localhost:5173
    - http://localhost:3000
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-32-bytes-min!!}
    issuer: fold-papper
    access-token-ttl: ${JWT_TTL:P7D}
  storage:
    location: ${STORAGE_DIR:./uploads}
    public-path: /uploads
    max-file-size: 10485760

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

logging:
  level:
    com.foldpapper: INFO
